[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketopt"
version = "1.0.0"
description = "Automated design, analysis, optimisation and CAD export of high-performance model rockets for Estes motors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RocketOpt Contributors" }]
keywords = [
    "model-rocketry",
    "aerodynamics",
    "barrowman",
    "optimisation",
    "cad",
    "flight-simulation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core dependencies. Everything needed to design, analyse, simulate and
# optimise a rocket from the command line. Deliberately kept to pure-Python /
# wheel-only packages so that `pip install rocketopt` never needs a compiler.
dependencies = [
    # numpy>=2.0 for np.trapezoid, used for thrust-curve integration.
    "numpy>=2.0",
    "scipy>=1.11",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "deap>=1.4",
    "sympy>=1.12",
    "networkx>=3.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy or platform-sensitive extras, imported lazily by the modules that need
# them so the core install stays small and CI stays fast.
ui = ["PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.11"]
cad = ["cadquery>=2.4", "ezdxf>=1.1"]
mdo = ["openmdao>=3.30"]
reports = ["reportlab>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
]
all = [
    "rocketopt[ui,cad,mdo,reports]",
]

[project.scripts]
rocketopt = "rocketopt.cli:app"

[project.urls]
Documentation = "https://github.com/rocketopt/rocketopt/tree/main/docs"
Source = "https://github.com/rocketopt/rocketopt"

[tool.setuptools.packages.find]
include = ["rocketopt*"]

[tool.setuptools.package-data]
"rocketopt.assets" = ["**/*.yaml", "**/*.eng", "**/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that take more than a few seconds",
    "validation: marks tests that check against published reference data",
    "requires_cad: marks tests needing the optional CadQuery extra",
    "requires_ui: marks tests needing the optional PySide6 extra",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Optional extras ship without type stubs.
[[tool.mypy.overrides]]
module = [
    "deap.*",
    "cadquery.*",
    "pyvista.*",
    "pyvistaqt.*",
    "openmdao.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "ezdxf.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
    "E741",  # single-letter names are idiomatic in aerodynamic equations
    "N803",  # allow uppercase argument names matching engineering symbols
    "N806",  # allow uppercase local names matching engineering symbols
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["rocketopt"]
omit = ["rocketopt/ui/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
